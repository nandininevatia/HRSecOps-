# Free fallback "alarm clock": hits the app's /cron endpoint on a schedule, in
# case Cloudflare Cron is unavailable. Set two repo secrets to enable it:
#   APP_URL     e.g. https://hrsecops.<subdomain>.workers.dev
#   CRON_SECRET the same value set on the Worker (Settings > Variables)
# GitHub Actions is free (public repos unlimited; private repos 2,000 min/month).

name: Scheduled reports (fallback)

on:
  schedule:
    - cron: "15 9 * * *" # 09:15 UTC daily (offset from Cloudflare's 09:00)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /cron
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then echo "APP_URL not set; skipping"; exit 0; fi
          curl -fsS "${{ secrets.APP_URL }}/cron?key=${{ secrets.CRON_SECRET }}" && echo "\nOK"
